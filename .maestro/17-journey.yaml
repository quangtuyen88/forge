appId: app.regulift
name: 17-journey
---
# Journey regression: the Progress timeline reads the records the earlier flows already produced.
# Every assertion here is required — one silent skip would hide exactly the untruthful state this
# surface is built to avoid.
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "My Progress"
    timeout: 10000
- assertVisible: "My Progress"
- assertVisible: "Settings"
- tapOn: "Overview"
# Overview stays the default segment. The photo state on this device is concealed: the Photos tool
# row states the private state, and no photo entry loads image bytes.
- scrollUntilVisible:
    element:
      text: "Photos, Private progress photos"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Photos, Private progress photos"
- takeScreenshot: /tmp/forge-e2e/shots/17-photos-private
# The Timeline segment shares the Overview header and sky. Its week card and filter chips sit at the
# top of the list and scroll away with it; a docked week bar replaces them while scrolled.
- tapOn: "Timeline"
- extendedWaitUntil:
    visible:
      id: "journey.filter.all"
    timeout: 15000
- assertVisible:
    id: "journey.filter.all"
    selected: true
- assertVisible: "Add a note about today"
- assertVisible: "Month, .* 20[0-9]{2}"
- assertVisible: "(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday), .* 20[0-9]{2}"
# A day that also holds an unfinished session can push the finished entry below the fold,
# so the card is scrolled to before it is asserted (DEFECT-002, 2026-09-21).
- scrollUntilVisible:
    element:
      text: "Workout, .*View workout"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Workout, .*View workout"
- takeScreenshot: /tmp/forge-e2e/shots/17-timeline
# A progress photo card, when one is present at the top of the timeline, must keep its image
# bytes unloaded: only the pose label may show, and a reveal stays on this device. This run's
# seed has no photo, so this block only executes if a photo entry is actually visible.
- runFlow:
    when:
      visible: "Progress photo, .*"
    commands:
      - assertVisible: "Progress photo, .*private, not revealed.*View privately.*"
      - assertNotVisible: "Revealed on this device"
      - tapOn: "Progress photo, .*"
      - extendedWaitUntil:
          visible: "Photo revealed on this device"
          timeout: 10000
      - assertVisible: "Photo revealed on this device"
# One workout card opens the canonical session detail — the same record History shows.
# Filter to Workouts first: a busy month can push every session past the first page. The chips
# scroll with the list, so bring the list back to its top before tapping one.
- scrollUntilVisible:
    element:
      id: "journey.filter.workout"
    direction: UP
    timeout: 20000
- tapOn:
    id: "journey.filter.workout"
- extendedWaitUntil:
    visible:
      id: "journey.filter.workout"
      selected: true
    timeout: 10000
# A filter change opens the list at its top: the newest workout card sits right under the chips.
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Workout, .*View workout"
    index: 0
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Workout details"
    timeout: 15000
- assertVisible: "Sets"
- assertVisible: "Tonnage"
- takeScreenshot: /tmp/forge-e2e/shots/17-session-detail
# Edit and save one set in place. Saving writes the existing set: the entry count never grows.
# Address the toolbar button by its stable identifier, not its mutable Edit/Done label.
- tapOn:
    id: "session.edit.toggle"
- extendedWaitUntil:
    visible: "Done"
    timeout: 10000
- extendedWaitUntil:
    visible: "Weight"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*reps, Increment"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    text: ".*reps, Increment"
    index: 0
- tapOn:
    id: "session.edit.toggle"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 10000
- assertVisible: "Edit"
# Back to the timeline through the existing Progress tab, with the Workouts filter still on.
- tapOn: "Progress"
- scrollUntilVisible:
    element:
      id: "journey.filter.workout"
    direction: UP
    timeout: 20000
- assertVisible:
    id: "journey.filter.workout"
    selected: true
- assertVisible: "Workout, .*View workout"
# Back to every entry type before writing the note.
- tapOn:
    id: "journey.filter.all"
- extendedWaitUntil:
    visible:
      id: "journey.filter.all"
      selected: true
    timeout: 10000
# A note written here stays on this device and appears on its own day.
- tapOn: "Add a note about today"
- extendedWaitUntil:
    visible: "New note"
    timeout: 10000
- assertVisible: "Notes stay on this device.*"
- tapOn: "Note"
- inputText: "E2E reflection"
- tapOn: "Save"
# The note lands on its own day; a busy day can push it below the fold, so scroll to it.
- scrollUntilVisible:
    element:
      text: "Note, Note, .*E2E reflection, Edit note"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
    centerElement: false
- assertVisible: "Note, Note, .*E2E reflection, Edit note"
- takeScreenshot: /tmp/forge-e2e/shots/17-note-added
# Relaunch with nothing fetched: the remembered segment reopens the timeline and the note survives.
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- scrollUntilVisible:
    element:
      id: "journey.filter.all"
    direction: UP
    timeout: 20000
- assertVisible: "Month, .* 20[0-9]{2}"
- scrollUntilVisible:
    element:
      text: "Note, Note, .*E2E reflection, Edit note"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
    centerElement: false
- assertVisible: "Note, Note, .*E2E reflection, Edit note"
- takeScreenshot: /tmp/forge-e2e/shots/17-relaunch-persisted
# Source navigation after an in-place edit is proven above, and one card per source record
# is asserted natively in ForgeTests; the relaunch here proves the note survived with
# nothing fetched.
# The timeline is local: "About this timeline" says so, and states what is never shared or published.
- scrollUntilVisible:
    element:
      text: "More timeline options"
    direction: UP
    timeout: 20000
- tapOn: "More timeline options"
- tapOn: "About this timeline"
- extendedWaitUntil:
    visible: "Works offline.*"
    timeout: 10000
- assertVisible: "Works offline.*"
- assertVisible: "Notes and body entries are never shared or published"
- takeScreenshot: /tmp/forge-e2e/shots/17-about
- tapOn: "Done"
# Hide the workout without touching the record behind it. Index 0 is the newest workout — the
# same order the Hide menu lists.
- tapOn: "More timeline options"
- tapOn: "Hide an item"
- copyTextFrom:
    text: "Hide Full .*"
    index: 0
- tapOn:
    text: "${maestro.copiedText}"
- extendedWaitUntil:
    visible: "Hidden from your timeline"
    timeout: 10000

- tapOn: "More timeline options"
- extendedWaitUntil:
    visible: "Hidden items \\(1\\)"
    timeout: 10000
- tapOn: "Hidden items \\(1\\)"
- extendedWaitUntil:
    visible: "Hidden items"
    timeout: 10000
- assertVisible: "1 hidden. Hiding only removes an entry from the timeline.*"
- assertVisible: "Restore .*"
- takeScreenshot: /tmp/forge-e2e/shots/17-hidden-items
# Hidden items restores the same card; the source record was never deleted.
- tapOn: "Restore .*"
- extendedWaitUntil:
    visible: "Nothing is hidden.*"
    timeout: 10000
- assertVisible: "Nothing is hidden.*"
- tapOn: "Done"
- tapOn: "Overview"
- tapOn: "Timeline"
- extendedWaitUntil:
    visible:
      id: "journey.filter.all"
    timeout: 15000
- tapOn: "More timeline options"
- assertVisible: "Hidden items"
- tapOn: "Hidden items"
- extendedWaitUntil:
    visible: "Nothing is hidden.*"
    timeout: 10000
- tapOn: "Done"
# Month chooser steps through whatever months actually hold content, with no hardcoded
# calendar labels: open the chooser and reselect the current month. A fresh run may have only
# one covered month, so "Continue to" is not tapped here.
- tapOn: "Month, .* 20[0-9]{2}"
- extendedWaitUntil:
    visible: "[A-Z][a-z]+ 20[0-9]{2}.*"
    timeout: 10000
- tapOn:
    text: "[A-Z][a-z]+ 20[0-9]{2}.*"
    index: 0
- assertVisible: "Month, .* 20[0-9]{2}"
# Filter chips: OR semantics, "All" is the empty selection.
- tapOn:
    id: "journey.filter.workout"
- extendedWaitUntil:
    visible:
      id: "journey.filter.workout"
      selected: true
    timeout: 10000
# A filter change opens the list at its top: the newest workout card sits right under the chips.
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "Workout, .*"
- assertNotVisible: "Note, Note, .*E2E reflection, Edit note"
- tapOn:
    id: "journey.filter.all"
- extendedWaitUntil:
    visible:
      id: "journey.filter.all"
      selected: true
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Note, Note, .*E2E reflection, Edit note"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
    centerElement: false
- assertVisible: "Note, Note, .*E2E reflection, Edit note"
- takeScreenshot: /tmp/forge-e2e/shots/17-filter-reset
