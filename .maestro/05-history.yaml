appId: app.regulift
name: 05-history
---
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Progress"
    timeout: 10000
# History is the first full-width Progress tool.
- tapOn: "History, .* sessions?"
- extendedWaitUntil:
    visible: "[A-Za-z]+ 20[0-9]{2}"
    timeout: 10000
- assertVisible: ".*Full A.*"
- takeScreenshot: /tmp/forge-e2e/shots/05-history
# Open the session logged in flow 03
- tapOn:
    text: ".*Full A.*"
    index: 0
- extendedWaitUntil:
    visible: "Sets"
    timeout: 10000
- assertVisible: "Tonnage"
# Optional set-limiter feedback persists without deleting the recorded set.
- scrollUntilVisible:
    element:
      text: "Add set feedback for set 1"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Add set feedback for set 1"
- extendedWaitUntil:
    visible: "Set feedback"
    timeout: 10000
- tapOn: "Set cut short.*"
- scrollUntilVisible:
    element:
      text: "What this affects"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "What this affects"
- tapOn: "Save"
# The sheet closes back onto the session, which may be scrolled past the metric tiles —
# assert on the record itself rather than on whatever happens to be in the viewport.
- extendedWaitUntil:
    visible: "(Avg RPE.*|Tonnage.*|Add set feedback for set 1|Edit set feedback for set 1)"
    timeout: 15000
- takeScreenshot: /tmp/forge-e2e/shots/05-session-detail
# Back to History list
- tapOn: "History"
