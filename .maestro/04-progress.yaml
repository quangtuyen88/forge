appId: app.regulift
name: 04-progress
---
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Progress"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/04-progress-top
# Tools now come before charts; target each section by semantics rather than fixed swipes.
- scrollUntilVisible:
    element:
      text: "Trends"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Trends"
- scrollUntilVisible:
    element:
      text: "Strength"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Strength"
- takeScreenshot: /tmp/forge-e2e/shots/04-strength-e1rm
- scrollUntilVisible:
    element:
      text: "Awards, .* of 10"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Awards, .* of 10"
- takeScreenshot: /tmp/forge-e2e/shots/04-awards-row
- tapOn: "Awards, .* of 10"
- extendedWaitUntil:
    visible: "Next up"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/04-awards
# Tap one badge -> badge detail sheet (title + rule sentence)
- tapOn: "First Session, 0 of 1"
- extendedWaitUntil:
    visible: "Log one session."
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/04-badge-detail
# Go back (dismiss badge detail sheet)
- swipe:
    start: "50%,20%"
    end: "50%,90%"
    duration: 400
