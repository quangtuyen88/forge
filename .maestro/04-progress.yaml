appId: app.regulift
name: 04-progress
---
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Progress"
    timeout: 10000
# Progress remembers its segment; the Overview is what this flow reads.
- tapOn: "Overview"
- takeScreenshot: /tmp/forge-e2e/shots/04-progress-top
# The redesigned Overview proves itself top to bottom: week card, Highlights, trends, Explore.
- assertVisible: "This week"
- scrollUntilVisible:
    element:
      text: "Highlights"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Highlights"
- scrollUntilVisible:
    element:
      id: "progress.trends"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible:
    id: "progress.trends"
- scrollUntilVisible:
    element:
      text: "Explore"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Explore"
# Strength moved behind the best-lift highlight card, above the trends card, so scroll back up.
# Overview rows scroll under the pinned header and behind the floating tab bar, and Maestro
# counts a covered row as visible. A slow, centered scroll parks the card mid-screen.
- scrollUntilVisible:
    element:
      id: "progress.bestLift"
    direction: UP
    timeout: 30000
    speed: 10
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
# Centering can leave the card half under the pinned header; a short fixed nudge
# keeps it clear of both the header and the tab bar.
- swipe:
    start: "50%,45%"
    end: "50%,60%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "progress.bestLift"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Strength"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/04-strength-e1rm
# Tapping the Progress tab again pops back to the Overview root, by the consistency card.
- tapOn: "Progress"
# Progress remembers its segment; the Overview is what this flow reads.
- tapOn: "Overview"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      id: "progress.consistency"
    direction: DOWN
    timeout: 30000
    speed: 10
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
# Centering can leave the card half under the pinned header; a short fixed nudge
# keeps it clear of both the header and the tab bar.
- swipe:
    start: "50%,45%"
    end: "50%,60%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "progress.consistency"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Consistency"
    timeout: 10000
# The consistency calendar moved behind its highlight card; the Awards path is unchanged.
- scrollUntilVisible:
    element:
      text: "Awards, .* of 10"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Awards, .* of 10"
- takeScreenshot: /tmp/forge-e2e/shots/04-awards-row
- tapOn: "Awards, .* of 10"
- extendedWaitUntil:
    visible: "Next up"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/04-awards
# Tap one badge -> badge detail sheet (title + rule sentence)
- tapOn: "First Session, 0 of 1"
- extendedWaitUntil:
    visible: "Log one session."
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/04-badge-detail
# Go back (dismiss badge detail sheet)
- swipe:
    start: "50%,20%"
    end: "50%,90%"
    duration: 400
