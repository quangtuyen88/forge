appId: app.regulift
name: 12-workout-tools
---
- launchApp:
    appId: app.regulift
    arguments:
      # Voice always runs on the OS recognizer here: no test may depend on a model download.
      osSpeechOnly: true
- tapOn: "Today"
- tapOn: "Start (Full|Upper|Lower|Push|Pull|Legs).*"
- assertVisible: "Finish workout"
# Focus mode shares the same set state and exposes a real remaining count.
- tapOn: "More options"
- tapOn: "Focus mode"
- assertVisible: "Focus Mode"
- assertVisible: ".*sets left"
- tapOn: "Exit"
# Voice control can arm and stop without scrolling.
- tapOn: "Start voice control"
- repeat:
    times: 2
    commands:
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Stop voice control"
    commands:
      - takeScreenshot: /tmp/forge-e2e/shots/12-voice-listening
      - tapOn: "Stop voice control"
# Typed quick logging shares the voice command pipeline. The disclosure sits below the
# exercise queue and a voice-unavailable banner can push it under the home indicator, so it
# is scrolled into view before the tap instead of being tapped at whatever coordinate it
# happens to occupy (the cause of the 2026-09-21 DEFECT-001 failure).
- scrollUntilVisible:
    element:
      text: "Type a set"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: true
- tapOn: "Type a set"
- extendedWaitUntil:
    visible: "deadlift 132.5x8 @8"
    timeout: 10000
- tapOn: "deadlift 132.5x8 @8"
- inputText: "deadlift 60x8 @8"
- tapOn: "Quick log"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
- runFlow:
    when:
      visible: "Go to Deadlift"
    commands:
      - tapOn: "Go to Deadlift"
- assertVisible: "Rest"
- tapOn: "Skip rest"
# Workout utilities.
- tapOn: "More options"
- tapOn: "Plate calculator"
- assertVisible: "Plates"
# R04: the calculator answers for the SELECTED exercise. A movement that takes plates gets the
# per-side prescription; one that does not gets "No plates needed". The sheet must never pair
# a per-side barbell answer with "not loadable" for a lunge that has no bar.
- runFlow:
    when:
      visible: "No plates needed"
    commands:
      - assertNotVisible: "Per side"
      - assertNotVisible: "Not loadable with these plates"
- runFlow:
    when:
      notVisible: "No plates needed"
    commands:
      - assertVisible: "Per side"
- tapOn: "Done"
- tapOn: "More options"
- tapOn: "Notes"
- assertVisible: "Workout notes"
- tapOn: "Done"
- tapOn: "Exercise options"
- tapOn: "Why?"
- assertVisible: "Keep original"
- swipe:
    start: "50%,55%"
    end: "50%,95%"
    duration: 500
- tapOn: "Exercise options"
- tapOn: "Swap…"
- assertVisible: "Swap exercise"
- tapOn: "Cancel"
# Add-exercise sheet lives below the queue.
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 500
- swipe:
    direction: UP
    duration: 500
- tapOn: "Add exercise"
- assertVisible: "Add exercise"
- tapOn: "Cancel"
# Finish the short session and verify summary.
- tapOn: "Finish workout"
- assertVisible: ".*sets logged.*"
- tapOn: "Finish workout"
- assertVisible: "Workout details"
- assertVisible: "Muscles worked"
- tapOn: "Done"
- assertVisible: "Today"
