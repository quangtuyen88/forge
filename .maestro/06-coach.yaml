appId: app.regulift
name: 06-coach
---
- launchApp:
    appId: app.regulift
- tapOn: "Coach"
- extendedWaitUntil:
    visible: "Coach"
    timeout: 10000
- assertVisible: "Ask Nova"
- assertVisible: "Swap an exercise"
- takeScreenshot: /tmp/forge-e2e/shots/06-coach
# Exercise the composer without posting to the external coach service.
- tapOn: "Ask your coach"
- inputText: "Why did my weight drop?"
- assertVisible: "Why did my weight drop?"
- takeScreenshot: /tmp/forge-e2e/shots/06-coach-composer
- tapOn: "Done"
