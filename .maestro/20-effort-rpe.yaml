appId: app.regulift
name: 20-effort-rpe
---
# AU-05 / AU-06: a set logged without rating it must stay "not entered", and a set the lifter
# actually rates must read back as a rating. Effort is asked in the rest panel right after a set
# is logged; skipping rest without a tap leaves it unrated. Both are checked in the saved record,
# because the defect this guards is a stored value nobody chose.
- launchApp:
    appId: app.regulift
- tapOn: "Today"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 15000
- tapOn: "(Start (Full|Upper|Lower|Push|Pull|Legs)|Resume).*"
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 15000
# First set: log it and skip rest without touching the effort question.
- tapOn: "Log set.*"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 15000
- assertVisible: "How hard was set [0-9]+\\?"
- takeScreenshot: /tmp/forge-e2e/shots/20-effort-untouched
- tapOn: "Skip rest"
# Second set: rate it in the rest panel. The panel ignores taps for its first 0.6 s, so the tap
# waits for it to settle.
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 15000
- tapOn: "Log set.*"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Reported effort 8"
- takeScreenshot: /tmp/forge-e2e/shots/20-effort-reported
- tapOn: "Skip rest"
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: ".*sets logged.*"
    timeout: 15000
# The alert is modal: its button is the only "Finish workout" exposed.
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Workout details"
    timeout: 20000
- takeScreenshot: /tmp/forge-e2e/shots/20-summary
- tapOn: "Done"
# The saved record must say the same thing: a mixed session shows the explainer that only
# self-rated sets count as effort. Relaunch first so the read is from storage, not from the
# view state that just wrote it.
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Progress"
    timeout: 15000
# Progress remembers its segment; History lives on Overview.
- tapOn: "Overview"
- runFlow: _overview-bottom.yaml
- tapOn:
    id: "progress.history"
    below:
      text: "Timeline"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "[A-Za-z]+ 20[0-9]{2}"
    timeout: 15000
- tapOn:
    text: ".*(Full|Upper|Lower|Push|Pull|Legs).*"
    index: 0
- extendedWaitUntil:
    visible: "Workout details"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "history.effortExplainer"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- assertVisible:
    id: "history.effortExplainer"
- takeScreenshot: /tmp/forge-e2e/shots/20-history-effort-explainer
# R01: the row for the set nobody rated carries no effort suffix, while the rated one does.
# The header already says "1 of 2 sets"; the rows must not contradict it. Rows are matched
# through their VoiceOver labels, which state the same provenance as the visible suffix.
- scrollUntilVisible:
    element:
      text: "[0-9]+([.,][0-9])? (kg|lb), [0-9]+ reps, effort not recorded"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
- assertVisible: "[0-9]+([.,][0-9])? (kg|lb), [0-9]+ reps, effort not recorded"
- scrollUntilVisible:
    element:
      text: "[0-9]+([.,][0-9])? (kg|lb), [0-9]+ reps, reported RPE [0-9].*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
- assertVisible: "[0-9]+([.,][0-9])? (kg|lb), [0-9]+ reps, reported RPE [0-9].*"
- takeScreenshot: /tmp/forge-e2e/shots/20-history-row-provenance
