appId: app.regulift
name: 07-fuel
---
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Progress"
    timeout: 10000
# Overview rows scroll under the pinned header and behind the floating tab bar, and Maestro
# counts a covered row as visible. A slow, centered scroll parks the row mid-screen.
- scrollUntilVisible:
    element:
      id: "progress.fuel"
    direction: DOWN
    timeout: 30000
    speed: 10
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
# The centered scroll can still park a row under the pinned header; nudge the list down.
- swipe:
    start: "50%,40%"
    end: "50%,64%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "progress.fuel"
    below:
      text: "Timeline"
    retryTapIfNoChange: true
# First visit shows the setup hero card.
- extendedWaitUntil:
    visible: "Fuel the block|kcal left.*"
    timeout: 10000
- runFlow:
    when:
      visible: "Set targets"
    commands:
      - tapOn: "Set targets"
      - extendedWaitUntil:
          visible: "Fuel targets"
          timeout: 10000
      - swipe:
          start: "50%,80%"
          end: "50%,40%"
      - tapOn: "Save"
# Fuel home: kcal header + macro rings.
- extendedWaitUntil:
    visible: "kcal left.*"
    timeout: 10000
- assertVisible: "protein"
- takeScreenshot: /tmp/forge-e2e/shots/07-fuel-home
# Create and log a local food without calling the external food API.
- tapOn:
    text: "Add"
    index: 0
- extendedWaitUntil:
    visible: "Search foods"
    timeout: 10000
- tapOn: "Custom food"
- extendedWaitUntil:
    visible: "Custom food"
    timeout: 10000
- tapOn:
    id: "custom-food-name"
- inputText: "E2E Oats"
- tapOn:
    id: "custom-food-kcal"
- inputText: "380"
- tapOn:
    id: "custom-food-protein"
- inputText: "13"
- tapOn:
    id: "custom-food-carbs"
- inputText: "68"
- tapOn:
    id: "custom-food-fat"
- inputText: "7"
- pressKey: Enter
- swipe:
    direction: UP
    duration: 500
- tapOn: "Save food"
- extendedWaitUntil:
    visible: "E2E Oats.*"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/07-food-entry
