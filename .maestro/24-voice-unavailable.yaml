appId: app.regulift
name: 24-voice-unavailable
---
# OBS-007 / FQ-15: with voice unavailable, the failure logs nothing and logging by hand in the
# editor still works.
- launchApp:
    appId: app.regulift
    arguments:
      voiceUnavailable: true
- tapOn: "Today"
- tapOn: "(Start (Full|Upper|Lower|Push|Pull|Legs)|Resume).*"
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 15000
- tapOn: "Start voice control"
- extendedWaitUntil:
    visible: "Microphone or speech permission is off\\. Enable it in Settings\\."
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/24-voice-unavailable
# A failed voice start must not create a set.
- assertVisible: "Log set 1"
# The editor stays the fallback: logging by hand works with voice unavailable.
- tapOn: "Log set 1"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/24-logged-by-hand
# Leave the suite clean: finish the partial workout.
- tapOn: "Skip rest"
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: ".*sets logged.*"
    timeout: 15000
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Workout details"
    timeout: 20000
- tapOn: "Done"
