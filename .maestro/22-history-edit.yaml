appId: app.regulift
name: 22-history-edit
---
# AU-19 / AU-20: an edit is a draft until Save, and Cancel leaves the record untouched.
# The row writes nothing while it is being typed, so the assertions read the saved record.
- launchApp:
    appId: app.regulift
# Log one loaded set in a fresh session so the edit below never depends on the day's plan.
- tapOn: "Today"
- tapOn: "(Start (Full|Upper|Lower|Push|Pull|Legs)|Resume).*"
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Type a set"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
- tapOn: "Type a set"
- extendedWaitUntil:
    visible: "deadlift 132.5x8 @8"
    timeout: 10000
- tapOn: "deadlift 132.5x8 @8"
- inputText: "deadlift 60x8 @8"
- tapOn: "Quick log"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
- extendedWaitUntil:
    visible: "Skip rest|Logged Deadlift.*"
    timeout: 10000
- runFlow:
    when:
      visible: "Skip rest"
    commands:
      - tapOn: "Skip rest"
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: ".*sets logged.*"
    timeout: 15000
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Workout details"
    timeout: 20000
- tapOn: "Done"
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Progress"
    timeout: 15000
# Progress remembers its segment; History lives on Overview.
- tapOn: "Overview"
- tapOn: "History, .* sessions?"
- extendedWaitUntil:
    visible: "[A-Za-z]+ 20[0-9]{2}"
    timeout: 15000
- tapOn:
    text: ".*(Full|Upper|Lower|Push|Pull|Legs).*"
    index: 0
- extendedWaitUntil:
    visible: "Workout details"
    timeout: 15000
- takeScreenshot: /tmp/forge-e2e/shots/22-session-before-edit

# --- AU-20: Cancel abandons the draft ---
- tapOn:
    id: "session.edit.toggle"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "^6[0-9](\\.[0-9])?$"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: true
# Tap the trailing edge so the cursor lands after the digits; eraseText deletes backwards.
- tapOn:
    text: "^6[0-9](\\.[0-9])?$"
    index: 0
    point: "80%,50%"
- eraseText
- inputText: "664"
- hideKeyboard
# Typing must not move the committed session's metrics: an in-flight 664 is not a saved set.
- assertNotVisible: "5,8[0-9][0-9]"
- takeScreenshot: /tmp/forge-e2e/shots/22-draft-not-committed
- tapOn:
    id: "session.edit.cancel"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 15000
- assertNotVisible: "664 (kg|lb), .*"
- takeScreenshot: /tmp/forge-e2e/shots/22-cancel-restored

# --- AU-19: Save commits once, with the decimal preserved ---
- tapOn:
    id: "session.edit.toggle"
- scrollUntilVisible:
    element:
      text: "^6[0-9](\\.[0-9])?$"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: true
# Tap the trailing edge so the cursor lands after the digits; eraseText deletes backwards.
- tapOn:
    text: "^6[0-9](\\.[0-9])?$"
    index: 0
    point: "80%,50%"
- eraseText
- inputText: "62.5"
- hideKeyboard
- takeScreenshot: /tmp/forge-e2e/shots/22-after-edit-field
- tapOn:
    id: "session.edit.toggle"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 15000
# The saved load keeps its decimal: 62.5 must not read back as 63.
- assertVisible: "62[.,]5 (kg|lb), [0-9]+ reps.*"
- assertVisible: "Tonnage, .*"
- takeScreenshot: /tmp/forge-e2e/shots/22-session-after-edit
