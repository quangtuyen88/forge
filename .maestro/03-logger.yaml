appId: app.regulift
name: 03-logger
---
- launchApp:
    appId: app.regulift
# No swipe: a fling left Start under the status bar, where the tap scrolls to top.
# This returns at once when Start is already on screen.
- scrollUntilVisible:
    element:
      id: "today\\.(start|resume)"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: "today\\.(start|resume)"
# The first workout asks for notification permission; the alert can vanish before the tap.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn:
          text: "Allow"
          optional: true
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/03-logger
# First set of the first exercise — one-tap log control
- tapOn: "Log set.*"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
# Rest panel: countdown + Skip
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 10000
- assertVisible: "Skip rest"
- takeScreenshot: /tmp/forge-e2e/shots/03-rest
- tapOn: "Skip rest"
# Second set
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 10000
- tapOn: "Log set.*"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
# Skip the second rest so the finish control is reachable
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 10000
- tapOn: "Skip rest"
# Finish: toolbar "Finish workout" -> confirmation dialog "Finish workout"
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: ".*sets logged.*"
    timeout: 10000
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Workout details"
    timeout: 10000
# A session logged this fast is refused for PRs and Crew on purpose — AU-15's trust guard.
- assertVisible: "Not counted for PRs, badges or Crew.*"
- takeScreenshot: /tmp/forge-e2e/shots/03-summary
# Share Cards v2: the composer opens over the saved summary, details start off, and the
# workout is already saved — closing it changes nothing.
- tapOn:
    id: "summary.shareCard"
- extendedWaitUntil:
    visible:
      id: "share.preview"
    timeout: 10000
- assertVisible:
    id: "share.format"
- assertVisible:
    id: "share.detail.rpe"
- assertVisible:
    id: "share.export"
- takeScreenshot: /tmp/forge-e2e/shots/03-share-card
- tapOn:
    id: "share.close"
- assertVisible: "Workout details"
- tapOn: "Done"
