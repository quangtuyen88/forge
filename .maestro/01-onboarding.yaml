appId: app.regulift
name: 01-onboarding
---
- launchApp:
    appId: app.regulift
    clearState: true
# Step 1: welcome
- extendedWaitUntil:
    visible: "Build my plan"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step0-welcome
- tapOn: "Build my plan"
# Step 2: coach (Nova is preselected)
- extendedWaitUntil:
    visible: "Who should coach you\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step1-coach
- tapOn: "Continue"
# Step 3: name
- extendedWaitUntil:
    visible: "What should Nova call you\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step2-name
- tapOn:
    id: "onboarding-name-field"
- inputText: "Alex"
- tapOn: "Continue"
# Step 4: hello statement
- extendedWaitUntil:
    visible: "Nice to meet you, Alex\\."
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step3-hello
- tapOn: "Got it"
# Step 5: goal — nothing is preselected
- extendedWaitUntil:
    visible: "What are you training for\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step4-goal
- tapOn: "Hypertrophy"
- tapOn: "Continue"
# Step 6: experience
- extendedWaitUntil:
    visible: "How long have you been lifting\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step5-experience
- tapOn: "Intermediate"
- tapOn: "Continue"
# Step 7: loop statement
- extendedWaitUntil:
    visible: "You log\\. Nova programs\\."
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step6-loop
- tapOn: "Got it"
# Step 8: days per week
- extendedWaitUntil:
    visible: "How many days a week can you train\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step7-days
- tapOn: "3 days"
- tapOn: "Continue"
# Step 9: session length
- extendedWaitUntil:
    visible: "How long is each session\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step8-length
- tapOn: "60 min"
- tapOn: "Continue"
# Step 10: gym — nothing is preselected
- extendedWaitUntil:
    visible: "Where do you train\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step9-gym
- tapOn: "Commercial gym"
- tapOn: "Continue"
# Step 11: Your numbers — enter 80 kg bodyweight
- extendedWaitUntil:
    visible: "Your numbers"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step10-numbers
- tapOn: "Bodyweight in kilograms"
- inputText: "80"
- tapOn:
    text: "Done"
    optional: true
- tapOn: "Continue"
# Step 12: work around — nothing flagged
- extendedWaitUntil:
    visible: "Anything to work around\\?"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-step11-workaround
- tapOn: "Continue"
# Step 13: summary (the building step auto-advances)
- extendedWaitUntil:
    visible: "Week 1 is ready, Alex"
    timeout: 20000
- takeScreenshot: /tmp/forge-e2e/shots/01-step13-summary
- tapOn: "Save this plan"
# Paywall — Debug-only bypass
- extendedWaitUntil:
    visible: "Continue without purchase"
    timeout: 10000
- takeScreenshot: /tmp/forge-e2e/shots/01-paywall
- tapOn: "Continue without purchase"
# Today
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 10000
- assertVisible: "Check in"
- takeScreenshot: /tmp/forge-e2e/shots/01-today
