appId: app.regulift
name: 23-finish-empty
---
# WK-10: finishing a session with nothing logged must ask before discarding, and discarding
# must leave no half-session behind on Today.
- launchApp:
    appId: app.regulift
- tapOn: "Today"
# Start clean: an earlier flow may have left a session open, which would show a partial-finish prompt instead.
- runFlow:
    when:
      visible: "Resume.*"
    commands:
      - tapOn: "Resume.*"
      - extendedWaitUntil:
          visible: "Log set.*"
          timeout: 15000
      - tapOn: "Finish workout"
      - extendedWaitUntil:
          visible: ".*sets logged.*|Nothing logged yet"
          timeout: 15000
      - tapOn: "Finish workout|Discard workout"
      - extendedWaitUntil:
          visible: "Workout details|Good (morning|afternoon|evening)"
          timeout: 20000
      - runFlow:
          when:
            visible: "Workout details"
          commands:
            - tapOn: "Done"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 15000
- tapOn: "(Start (Full|Upper|Lower|Push|Pull|Legs)|Resume).*"
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 15000
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Nothing logged yet"
    timeout: 15000
- assertVisible: "Discard workout"
# OBS-005 / FQ-13: the safe exit is visible and named, and it keeps the session.
- assertVisible: "Keep going"
- takeScreenshot: /tmp/forge-e2e/shots/23-nothing-logged
- tapOn: "Keep going"
- extendedWaitUntil:
    visible: "Finish workout"
    timeout: 10000
- assertVisible: "Finish workout"
- assertNotVisible: "Nothing logged yet"
- tapOn: "Finish workout"
- extendedWaitUntil:
    visible: "Nothing logged yet"
    timeout: 15000
- tapOn: "Discard workout"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 20000
- assertNotVisible: "Resume.*"
- takeScreenshot: /tmp/forge-e2e/shots/23-today-after-discard
