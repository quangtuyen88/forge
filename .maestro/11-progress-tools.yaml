appId: app.regulift
name: 11-progress-tools
---
- launchApp:
    appId: app.regulift
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
# Progress remembers its segment; the Overview is what this flow reads.
- tapOn: "Overview"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Overview"
- assertVisible: "Progress"
- tapOn: "Overview"
- runFlow: _overview-bottom.yaml
- tapOn:
    id: "progress.trainingAnalysis"
    below:
      text: "Timeline"
    retryTapIfNoChange: true
# The hub tile states its own label; the Overview row's label must not match it.
- extendedWaitUntil:
    visible: "Plan review, What works and what changed"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "progress.planAudit"
    direction: DOWN
    timeout: 30000
    speed: 10
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "progress.planAudit"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Plan review"
    timeout: 15000
- assertVisible: "Plan review"

- stopApp: app.regulift
