appId: app.regulift
name: 11-progress-tools
---
- launchApp:
    appId: app.regulift
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Overview"
- assertVisible: "Progress"
- tapOn: "Overview"
# Overview rows scroll under the pinned header and behind the floating tab bar, and Maestro
# counts a covered row as visible. A slow, centered scroll parks the row mid-screen.
- scrollUntilVisible:
    element:
      id: "progress.planAudit"
    direction: DOWN
    timeout: 30000
    speed: 10
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
# The centered scroll can still park a row under the pinned header; nudge the list down.
- swipe:
    start: "50%,40%"
    end: "50%,64%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Plan audit, What is working and what changed"
- tapOn:
    id: "progress.planAudit"
    below:
      text: "Timeline"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Plan audit"
    timeout: 15000
- assertVisible: "Plan audit"

- stopApp: app.regulift
- launchApp:
