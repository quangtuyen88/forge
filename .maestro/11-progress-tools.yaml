appId: app.regulift
name: 11-progress-tools
---
- launchApp:
    appId: app.regulift
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Overview"
- assertVisible: "Progress"
- tapOn: "Overview"
# Progress tools are full-width rows above the charts. The Plan Audit row is
# targeted by its stable identifier: the merged text's tap frame collides with the
# fixed Overview/Timeline segment once the row is scrolled into view, flipping the
# picker to Timeline. Disable centering and require full visibility so the row
# settles at the bottom of the viewport, clear of the fixed segment.
- scrollUntilVisible:
    element:
      id: "progress.planAudit"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: false
- assertVisible: "Plan audit, What is working and what changed"
- tapOn:
    id: "progress.planAudit"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Plan audit"
    timeout: 15000
- assertVisible: "Plan audit"

- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- tapOn: "Progress"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Overview"
