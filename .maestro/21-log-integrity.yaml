appId: app.regulift
name: 21-log-integrity
---
# AU-12: the same log operation sent twice must not produce two observations. A double tap on
# Log set is the repeat a lifter can actually send: the second tap must not log a second set,
# and, landing on the rest panel as it slides in, must not rate the first one either.
- launchApp:
    appId: app.regulift
    arguments:
      osSpeechOnly: true
- tapOn: "Today"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 15000
- tapOn: "(Start (Full|Upper|Lower|Push|Pull|Legs)|Resume).*"
- extendedWaitUntil:
    visible: "Log set 1"
    timeout: 15000
- doubleTapOn: "Log set 1"
# A load that jumps far above the record raises the plausibility question before anything is
# kept (AU-15's guard).
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - takeScreenshot: /tmp/forge-e2e/shots/21-plausibility-guard
      - tapOn: "Keep set"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 15000
- takeScreenshot: /tmp/forge-e2e/shots/21-first-log
- tapOn: "Skip rest"
# Exactly one set was logged: the editor moved on to set 2, not set 3.
- extendedWaitUntil:
    visible: "Log set 2"
    timeout: 15000
- assertNotVisible: "Log set 3"
- takeScreenshot: /tmp/forge-e2e/shots/21-second-log
