appId: app.regulift
name: 09-settings
---
- launchApp:
    appId: app.regulift
- tapOn: "Today"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 10000
- tapOn: "Settings"
# 1. The redesigned root: the plan sentence with chips over the hairline row lists.
- extendedWaitUntil:
    visible:
      id: "settings.chip.days"
    timeout: 10000
- assertVisible: "Training"
- takeScreenshot: /tmp/forge-e2e/shots/09-settings
# 2. Days chip round trip: pick 4, then Undo back to the demo seed's 3.
- tapOn:
    id: "settings.chip.days"
- extendedWaitUntil:
    visible:
      id: "settings.sheet.confirm"
    timeout: 5000
- takeScreenshot: /tmp/forge-e2e/shots/09-days-sheet
- tapOn:
    id: "settings.option.days.4"
- tapOn:
    id: "settings.sheet.confirm"
# The Undo pill lives 4 s (Today's Added · Undo pattern): wait for it, then tap it at once.
- extendedWaitUntil:
    visible:
      id: "settings.planUpdated.undo"
    timeout: 5000
- tapOn:
    id: "settings.planUpdated.undo"
- assertVisible:
    id: "settings.chip.days"
    text: ".*3.*"
# 3. Unit changes survive an app relaunch.
- scrollUntilVisible:
    element:
      id: "settings.row.units"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
- tapOn:
    id: "settings.row.units"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    text: "lb"
    index: 0
- tapOn: "Done"
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- tapOn: "Today"
- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings.chip.days"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "settings.row.units"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
- assertVisible:
    id: "settings.row.units"
    text: ".*lb.*"
- takeScreenshot: /tmp/forge-e2e/shots/09-settings-lb
- scrollUntilVisible:
    element:
      id: "settings.row.units"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
- tapOn:
    id: "settings.row.units"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    text: "kg"
    index: 0
- assertVisible:
    id: "settings.row.units"
    text: ".*kg.*"
# 4. Custom-exercise CRUD, through the pushed page.
- scrollUntilVisible:
    element:
      id: "settings.row.custom"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "settings.row.custom"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Custom exercises"
- runFlow:
    when:
      notVisible: "E2E Row"
    commands:
      - tapOn: "Add custom exercise"
      - assertVisible: "New exercise"
      - tapOn: "Name"
      - inputText: "E2E Row"
      - tapOn: "Save"
- assertVisible: "E2E Row"
- tapOn: "Settings"
# 5. Coach page.
- scrollUntilVisible:
    element:
      id: "settings.row.coach"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "settings.row.coach"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Share training data"
- tapOn: "Settings"
# 6. Voice page.
- scrollUntilVisible:
    element:
      id: "settings.row.voice"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "settings.row.voice"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Fast logging"
- tapOn: "Settings"
# 7. Plates page. It sits above the Voice row: scroll back up until the first Training row is fully
#    in view, so Plates is not half under the navigation bar when it is tapped.
- scrollUntilVisible:
    element:
      id: "settings.row.plan"
    direction: UP
    timeout: 20000
    visibilityPercentage: 100
- tapOn:
    id: "settings.row.plates"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Plates you own"
- tapOn: "Settings"
# 9. Your data page: import and export tools stay reachable.
- scrollUntilVisible:
    element:
      id: "settings.row.data"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "settings.row.data"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Import from Strong or Hevy"
- assertVisible: "Export CSV"
- tapOn: "Import from Strong or Hevy"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Import history"
# Import is pushed inside Settings now: go back by page title.
- tapOn: "Your data"
- tapOn: "Settings"
# 10. Footer: the feedback capsule.
- scrollUntilVisible:
    element:
      id: "settings.feedback"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "settings.feedback"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible: "Send feedback"
# Feedback is pushed inside Settings now: go back instead of Cancel.
- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 1000
- tapOn: "Done"
