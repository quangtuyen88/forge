appId: app.regulift
name: 10-abandoned-session
---
- launchApp:
    appId: app.regulift
- tapOn: "Today"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 10000
- assertNotVisible: "Resume.*"
- takeScreenshot: /tmp/forge-e2e/shots/10-a-today-before
# A long full-tour recording can cross midnight. Complete the new day's check-in when needed.
- runFlow:
    when:
      visible: "Check in"
    commands:
      - tapOn: "Check in"
      - extendedWaitUntil:
          visible: "Daily check-in"
          timeout: 10000
      - swipe:
          start: "50%,70%"
          end: "50%,30%"
      - tapOn: "Save check-in"
      - extendedWaitUntil:
          visible: "Start (Full|Upper|Lower|Push|Pull|Legs).*"
          timeout: 10000
# Start a session and persist one logged set.
- tapOn: "Start (Full|Upper|Lower|Push|Pull|Legs).*"
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 10000
- tapOn: "Log set.*"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 10000
- tapOn: "Skip rest"
- takeScreenshot: /tmp/forge-e2e/shots/10-b-logger-one-set
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 10000
- assertVisible: "Resume.*1 set.*logged"
- takeScreenshot: /tmp/forge-e2e/shots/10-c-today-resume
# Progress still renders while an unfinished session exists.
- tapOn: "Progress"
- assertVisible: "Progress"
- takeScreenshot: /tmp/forge-e2e/shots/10-d-progress-after
- scrollUntilVisible:
    element:
      text: "Strength"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
    centerElement: true
- assertVisible: "Strength"
- takeScreenshot: /tmp/forge-e2e/shots/10-e-strength-after
# Finish the resumed session and leave the suite clean.
- tapOn: "Today"
- tapOn: "Resume.*1 set.*logged"
- assertVisible: "Log set.*"
- tapOn: "Finish workout"
- assertVisible: ".*sets logged.*"
- tapOn: "Finish workout"
- assertVisible: "Workout details"
- tapOn: "Done"
- assertVisible: "Today"
