appId: app.regulift
name: 10-abandoned-session
---
- launchApp:
    appId: app.regulift
- tapOn: "Today"
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 10000
- assertNotVisible: "Resume.*"
- takeScreenshot: /tmp/forge-e2e/shots/10-a-today-before
# A long full-tour recording can cross midnight. Complete the new day's check-in when needed.
- runFlow:
    when:
      visible: "Check in"
    commands:
      - tapOn: "Check in"
      - extendedWaitUntil:
          visible: "Daily check-in"
          timeout: 10000
      - swipe:
          start: "50%,70%"
          end: "50%,30%"
      - tapOn: "Save check-in"
      - extendedWaitUntil:
          visible: "Start (Full|Upper|Lower|Push|Pull|Legs).*"
          timeout: 10000
# Start a session and persist one logged set.
- tapOn: "Start (Full|Upper|Lower|Push|Pull|Legs).*"
- extendedWaitUntil:
    visible: "Log set.*"
    timeout: 10000
- tapOn: "Log set.*"
- runFlow:
    when:
      visible: "Big jump.*Keep it\\?"
    commands:
      - tapOn: "Keep set"
- extendedWaitUntil:
    visible: "Skip rest"
    timeout: 10000
- tapOn: "Skip rest"
- takeScreenshot: /tmp/forge-e2e/shots/10-b-logger-one-set
- stopApp: app.regulift
- launchApp:
    appId: app.regulift
- extendedWaitUntil:
    visible: "Good (morning|afternoon|evening)"
    timeout: 10000
- assertVisible: "Resume.*1 set.*logged"
- takeScreenshot: /tmp/forge-e2e/shots/10-c-today-resume
# Progress still renders while an unfinished session exists.
- tapOn: "Progress"
# Progress remembers its segment; the Overview is what this flow reads.
- tapOn: "Overview"
- assertVisible: "Progress"
- takeScreenshot: /tmp/forge-e2e/shots/10-d-progress-after
# Strength now lives behind the best-lift highlight card on the redesigned Overview.
# Overview rows scroll under the pinned header and behind the floating tab bar, and Maestro
# counts a covered row as visible. A slow, centered scroll parks the card mid-screen.
- scrollUntilVisible:
    element:
      id: "progress.bestLift"
    direction: DOWN
    timeout: 30000
    speed: 10
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
# Centering can leave the card half under the pinned header; a short fixed nudge
# keeps it clear of both the header and the tab bar.
- swipe:
    start: "50%,45%"
    end: "50%,60%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "progress.bestLift"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Strength"
    timeout: 10000
- assertVisible: "Strength"
- takeScreenshot: /tmp/forge-e2e/shots/10-e-strength-after
# Finish the resumed session and leave the suite clean.
- tapOn: "Today"
- tapOn: "Resume.*1 set.*logged"
- assertVisible: "Log set.*"
- tapOn: "Finish workout"
- assertVisible: ".*sets logged.*"
- tapOn: "Finish workout"
- assertVisible: "Workout details"
- tapOn: "Done"
- assertVisible: "Today"
