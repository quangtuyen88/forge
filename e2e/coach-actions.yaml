appId: app.regulift
name: coach-actions
---
# The runner (scripts/test-coach-e2e.sh) installs, seeds and launches the app itself with the
# stub coach URL, so this flow must not launch the app.
- tapOn: "Coach"
- extendedWaitUntil:
    visible:
      id: "coach.input"
    timeout: 10000
# Swap card: both illustrations, then Undo puts the planned exercise back. First, while the
# fixture's next session still has the bent-over row.
- tapOn:
    id: "coach.input"
- inputText: "Can I swap bent-over rows?"
# The on-screen keyboard can slide in late and move the send arrow away from the tap: dismiss it
# (toolbar Done) and let the layout settle before every Send tap.
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Send message"
- runFlow:
    when:
      visible: "Agree and continue"
    commands:
      - tapOn: "Agree and continue"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Done"
    optional: true
- extendedWaitUntil:
    visible: "Swap exercise"
    timeout: 15000
- assertVisible: "Seal Row"
- takeScreenshot: ${OUT}/05-swap-card
- tapOn: "Apply"
- extendedWaitUntil:
    visible: "Exercise swapped"
    timeout: 15000
- takeScreenshot: ${OUT}/06-swap-receipt
# The card collapses into the receipt with an animation; tap once the layout has settled.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "coach.receipt.undo"
- extendedWaitUntil:
    visible: "Undone\\. Barbell Bent-Over Row is back in your plan\\."
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${OUT}/07-swap-undone
- tapOn:
    id: "coach.input"
- inputText: "I can only train 3 days a week now, 45 minutes."
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Send message"
# First-message consent sheet.
- runFlow:
    when:
      visible: "Agree and continue"
    commands:
      - tapOn: "Agree and continue"
# The keyboard comes back after the consent sheet; its toolbar Done dismisses it
# (hideKeyboard does not dismiss this multi-line composer).
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Plan change"
    timeout: 15000
- assertVisible: "Days per week"
- assertVisible: "Apply plan changes"
- takeScreenshot: ${OUT}/01-plan-card
- tapOn: "Apply plan changes"
- extendedWaitUntil:
    visible: "Plan updated"
    timeout: 15000
- assertVisible:
    id: "coach.receipt.undo"
- takeScreenshot: ${OUT}/02-receipt
# The card collapses into the receipt with an animation; tap once the layout has settled.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "coach.receipt.undo"
- extendedWaitUntil:
    visible: "Undone. Your plan is back to.*"
    timeout: 15000
- assertVisible: "Undone"
- assertNotVisible:
    id: "coach.receipt.undo"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${OUT}/03-undone
# Ask the same question again (no consent sheet this time). Regression check for the ledger's
# "reverted" state: without it, the second Apply is refused as "already applied".
- tapOn:
    id: "coach.input"
- inputText: "I can only train 3 days a week now, 45 minutes."
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Send message"
# Dismiss the keyboard (its toolbar Done) before waiting for the new card: Maestro
# counts elements under the keyboard as visible, so a tap could land on the keyboard.
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
# No drag here: the new card has to scroll itself into view.
- extendedWaitUntil:
    visible: "Apply plan changes"
    timeout: 15000
# The undone change must not count as a plan change: this card's advice reads like the first one.
- takeScreenshot: ${OUT}/08-second-card
- tapOn: "Apply plan changes"
- extendedWaitUntil:
    visible:
      id: "coach.receipt.undo"
    timeout: 15000
- assertNotVisible: "You already applied this one.*"
- takeScreenshot: ${OUT}/04-reapplied
