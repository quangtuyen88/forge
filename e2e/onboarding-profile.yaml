appId: app.regulift
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Build my plan"
    timeout: 20000
- tapOn: "Build my plan"
- extendedWaitUntil:
    visible: "Who should coach you\\?"
    timeout: 20000
- assertVisible: "Step 2 of 15"
- tapOn: "Kai.*"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "What should Kai call you\\?"
    timeout: 20000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Nice to meet you\\."
    timeout: 20000
- tapOn: "Got it"
- tapOn: "Strength"
- tapOn: "Continue"
- tapOn: "Advanced"
- tapOn: "Continue"
- tapOn: "Got it"
- tapOn: "4 days"
- tapOn: "Continue"
- tapOn: "45 min"
- tapOn: "Continue"
- tapOn: "Home"
- tapOn: "Continue"
- assertVisible: "Your numbers"
- tapOn: "Continue"
- assertVisible: "Your numbers"
- tapOn: "Bodyweight in kilograms"
- inputText: "82"
- tapOn: "Done"
- tapOn:
    id: "onboarding-current-lifts"
- scrollUntilVisible:
    element: "Barbell Bench Press (kg)"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn: "Barbell Bench Press (kg)"
- inputText: "80"
- tapOn:
    text: "Done"
    optional: true
- tapOn: "Continue"
- tapOn: "Knee"
- tapOn:
    id: "recovery-reduced-toggle"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Week 1 is ready"
    timeout: 20000
- assertVisible: "Strength.+Advanced.+4.days.a.week.+45.min"
- scrollUntilVisible:
    element: "Starting loads from your 1 entered lifts"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn: "Save this plan"
- extendedWaitUntil:
    visible: "Continue without purchase"
    timeout: 20000
- tapOn: "Continue without purchase"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
- tapOn: "Settings"
# The redesigned Settings states the onboarding answers as the plan sentence with chips.
- extendedWaitUntil:
    visible:
      id: "settings.chip.days"
    timeout: 10000
- assertVisible:
    id: "settings.chip.days"
    text: ".*4 days.*"
- assertVisible:
    id: "settings.chip.minutes"
    text: ".*45 min.*"
- assertVisible:
    id: "settings.chip.goal"
    text: ".*move more weight.*"
- assertVisible:
    id: "settings.row.plan"
    text: ".*Advanced.*"
- assertVisible:
    id: "settings.row.gym"
    text: ".*Home.*"
# Change every plan input: chips, then the pushed plan and injuries pages.
- tapOn:
    id: "settings.chip.days"
- extendedWaitUntil:
    visible:
      id: "settings.sheet.confirm"
    timeout: 5000
- tapOn:
    id: "settings.option.days.5"
- tapOn:
    id: "settings.sheet.confirm"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "settings.chip.minutes"
- extendedWaitUntil:
    visible:
      id: "settings.sheet.confirm"
    timeout: 5000
- tapOn:
    id: "settings.option.minutes.60"
- tapOn:
    id: "settings.sheet.confirm"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "settings.chip.goal"
- extendedWaitUntil:
    visible:
      id: "settings.sheet.confirm"
    timeout: 5000
- tapOn:
    id: "settings.option.goal.both"
- tapOn:
    id: "settings.sheet.confirm"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "settings.row.plan"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Intermediate"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      id: "settings.row.injuries"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "settings.row.injuries"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "recovery-reduced-toggle"
- tapOn: "Settings"
- tapOn: "Done"
# Reopen and verify every change persisted.
- tapOn: "Settings"
- extendedWaitUntil:
    visible:
      id: "settings.chip.days"
    timeout: 10000
- assertVisible:
    id: "settings.chip.days"
    text: ".*5 days.*"
- assertVisible:
    id: "settings.chip.minutes"
    text: ".*60 min.*"
- assertVisible:
    id: "settings.chip.goal"
    text: ".*build size and strength.*"
- assertVisible:
    id: "settings.row.plan"
    text: ".*Intermediate.*"
- assertVisible:
    id: "settings.row.gym"
    text: ".*Home.*"
- tapOn: "Done"
