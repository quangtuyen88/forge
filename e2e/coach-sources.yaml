appId: app.regulift
name: coach-sources
---
# The runner (scripts/test-coach-e2e.sh) installs, seeds and launches the app itself with the
# stub coach URL, so this flow must not launch the app.
- tapOn: "Coach"
- extendedWaitUntil:
    visible:
      id: "coach.input"
    timeout: 10000
- tapOn:
    id: "coach.input"
- inputText: "Why does the roadmap say Week 3?"
- tapOn:
    text: "Done"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Send message"
# First-message consent sheet.
- runFlow:
    when:
      visible: "Agree and continue"
    commands:
      - tapOn: "Agree and continue"
- extendedWaitUntil:
    visible:
      id: "coach.source"
    timeout: 15000
- assertVisible: "How program weeks work"
- assertVisible: "Regulift guide"
- takeScreenshot: ${OUT}/16-source-row
