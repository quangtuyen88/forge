name = "forge-coach"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "regulift.app/p/*", zone_name = "regulift.app" }]

[vars]
PROVIDER = "workers-ai"
ENV = "production"

# Secrets (never in this file), one per call:
#   npx wrangler secret put APP_SECRET|ANTHROPIC_API_KEY|GEMINI_API_KEY
#   npx wrangler secret put GOOGLE_CLIENT_ID|RESEND_API_KEY
#   npx wrangler secret put RC_WEBHOOK_SECRET|RC_SECRET_KEY|ADMIN_SECRET
#   npx wrangler secret put JEV_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "forge"
database_id = "2cada305-64f8-45da-b923-1027a8936081"
migrations_dir = "migrations"

[ai]
binding = "AI"

# Enable Analytics Engine in the Cloudflare dashboard (Workers → Analytics Engine), then uncomment:
# [[analytics_engine_datasets]]
# binding = "EVENTS"
# dataset = "forge_events"

[[ratelimits]]
name = "COACH_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Optional hybrid retrieval (BM25 works without it) — to enable:
#   npx wrangler vectorize create forge-coach --dimensions=768 --metric=cosine
#   uncomment, pnpm run deploy, then: POST /admin/reindex with the x-forge-secret header
# [[vectorize]]
# binding = "VECTORS"
# index_name = "forge-coach"

# Staging: local dev and evals only (not deployed in v1). Production gets its own instance at rollout.
[env.staging]
name = "forge-coach-staging"
workers_dev = false
routes = []

[env.staging.vars]
PROVIDER = "workers-ai"
ENV = "staging"
COACH_REFERENCE_RETRIEVAL = "enabled"

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "forge"
database_id = "2cada305-64f8-45da-b923-1027a8936081"
migrations_dir = "migrations"

[[env.staging.ai_search]]
binding = "COACH_KB"
instance_name = "regulift-coach-kb-staging"
